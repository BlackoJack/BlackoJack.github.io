name: Deploy

"on":
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build & publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Build
        env:
          # Для репозитория <user>.github.io база — корень, иначе подпапка с именем репозитория.
          SITE_URL: https://${{ github.repository_owner }}.github.io
          BASE_PATH: ${{ github.event.repository.name == format('{0}.github.io', github.repository_owner) && '/' || format('/{0}/', github.event.repository.name) }}
          # Здесь нет серверных функций: форма открывает Telegram с готовым текстом.
          PUBLIC_FORM_MODE: static
        run: npm run build

      - name: Publish to gh-pages
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          cd dist
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "deploy ${GITHUB_SHA}"
          git push -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Summary
        if: github.event_name != 'pull_request'
        run: echo "Опубликовано: https://${{ github.repository_owner }}.github.io/" >> "$GITHUB_STEP_SUMMARY"
